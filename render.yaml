services:
  - type: web
    name: usc-clubday-ctf
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn 'wsgi:app' --workers 2 --worker-class gevent --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: REVERSE_PROXY
        value: "true"
